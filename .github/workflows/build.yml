name: Build

# The console build runs in the same dev container as upstream's `tools/dkp.sh`
# (devkitARM + 3gxtool + makerom, see tools/Dockerfile), so a release is reproducible from the
# repository alone. Tags v* build and publish; every push and pull request builds and attaches the
# packages to the run for testing.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n:
    name: Translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Every key has a Chinese text
        run: python3 tools/check-i18n.py

  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tests/host
        run: make -C tests/host test

  build:
    name: 3DSX and CIA
    runs-on: ubuntu-24.04
    needs: [i18n]
    steps:
      - uses: actions/checkout@v4

      - name: Build the dev image (devkitARM, 3gxtool, makerom)
        run: docker build -t 3dsrec-dev tools/

      - name: sysmodule, plugin, app
        run: |
          set -eux
          dkp() {
            docker run --rm -v "$PWD:/work" -w /work -e HOME=/tmp \
              --user "$(id -u):$(id -g)" 3dsrec-dev "$@"
          }
          dkp make -C sysmod
          dkp make -C plugin
          dkp make -C app
          dkp make -C app cia

      - name: Name the packages after the version
        run: |
          set -eu
          version=$(sed -n 's/^APP_VERSION :=\s*//p' app/Makefile)
          channel=$(sed -n 's/^APP_CHANNEL\s*:=\s*//p' app/Makefile)
          suffix=${channel:+-$channel}
          mkdir -p out
          cp app/3ds-recorder.3dsx "out/3ds-recorder-$version$suffix.3dsx"
          cp app/3ds-recorder.cia "out/3ds-recorder-$version$suffix.cia"
          cp app/3ds-recorder.smdh "out/3ds-recorder-$version$suffix.smdh"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-recorder-cn-${{ github.sha }}
          path: out/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3ds-recorder-cn-${{ github.sha }}
          path: out

      # A QR code next to each package: scanned with FBI on the console, it installs the CIA
      # straight from the release asset.
      - name: QR codes for the packages
        run: |
          set -eu
          python3 -m pip install --quiet qrcode pillow
          tag=${GITHUB_REF#refs/tags/}
          repo=${GITHUB_REPOSITORY}
          for f in out/*.cia out/*.3dsx; do
            name=$(basename "$f")
            url="https://github.com/$repo/releases/download/$tag/$name"
            python3 - "$url" "out/$name.qr.png" <<'PY'
          import sys, qrcode
          img = qrcode.make(sys.argv[1], box_size=6, border=2)
          img.save(sys.argv[2])
          PY
          done
          ls -l out

      # The notes name the packages' QR codes at the top: on the console, FBI scans one and
      # installs straight from the release asset. The rest is this version's changes only.
      - name: Compose the notes
        run: |
          set -eu
          tag=${GITHUB_REF#refs/tags/}
          repo=${GITHUB_REPOSITORY}
          {
            echo '| 3DSX（Homebrew Launcher） | CIA（FBI 扫码安装） |'
            echo '|---|---|'
            echo "| ![3DSX QR](https://github.com/$repo/releases/download/$tag/$(basename out/*.3dsx).qr.png) | ![CIA QR](https://github.com/$repo/releases/download/$tag/$(basename out/*.cia).qr.png) |"
            echo
            cat .github/release-notes.md
          } > out/notes.md
          cat out/notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: 3DS Recorder ${{ github.ref_name }}
          body_path: out/notes.md
          files: out/*
          draft: true
