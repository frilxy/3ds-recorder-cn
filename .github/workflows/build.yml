name: Build

# The console build runs in the same dev container as upstream's `tools/dkp.sh`
# (devkitARM + 3gxtool + makerom, see tools/Dockerfile), so a release is reproducible from the
# repository alone. Tags v* build and publish; every push and pull request builds and attaches the
# packages to the run for testing.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n:
    name: Translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Every key has a Chinese text
        run: python3 tools/check-i18n.py

      - name: docs/zh-strings.md matches the texts
        run: python3 tools/zh-strings.py --check

  # tests/host is left out: with -std=c11 the bench clock (CLOCK_MONOTONIC) does not compile on
  # this glibc, which is a plain upstream Makefile issue and has nothing to do with the texts.

  build:
    name: 3DSX and CIA
    runs-on: ubuntu-24.04
    needs: [i18n]
    steps:
      - uses: actions/checkout@v4

      # tools/Dockerfile.ci: the same pinned devkitARM, 3gxtool and makerom as tools/dkp.sh, minus
      # libctrpf (tests/benchplugin only) — its pacman repository answers 403 now and then.
      - name: Build the dev image (devkitARM, 3gxtool, makerom)
        run: docker build -f tools/Dockerfile.ci -t 3dsrec-dev tools/

      - name: sysmodule, plugin, app (system font)
        run: |
          set -eux
          dkp() {
            docker run --rm -v "$PWD:/work" -w /work -e HOME=/tmp \
              --user "$(id -u):$(id -g)" 3dsrec-dev "$@"
          }
          dkp make -C sysmod
          dkp make -C plugin
          dkp make -C app
          dkp make -C app cia
          version=$(sed -n 's/^APP_VERSION :=\s*//p' app/Makefile)
          mkdir -p out
          cp app/3ds-recorder.3dsx "out/3ds-recorder-$version-cn.3dsx"
          cp app/3ds-recorder.cia  "out/3ds-recorder-$version-cn.cia"
          cp app/3ds-recorder.smdh "out/3ds-recorder-$version-cn.smdh"
          ls -l out

      # The same app with the iQue console's shared font in romfs (app/assets/hanfont.bcfnt): it
      # draws every hanzi the console's own font may lack. The installed title version goes one
      # step higher, so installing it over the system-font build is an upgrade (as 3dsDL_CN does).
      - name: app with the bundled font
        run: |
          set -eux
          dkp() {
            docker run --rm -v "$PWD:/work" -w /work -e HOME=/tmp \
              --user "$(id -u):$(id -g)" 3dsrec-dev "$@"
          }
          version=$(sed -n 's/^APP_VERSION :=\s*//p' app/Makefile)
          font_version=$(python3 -c "m='$version'.split('.'); print('%s.%s.%d' % (m[0], m[1], int(m[2]) + 1))")
          cp app/assets/hanfont.bcfnt app/romfs/hanfont.bcfnt
          dkp make -C app APP_CHANNEL=cnwithfont
          dkp make -C app cia APP_CHANNEL=cnwithfont CIA_VERSION="$font_version"
          cp app/3ds-recorder.3dsx "out/3ds-recorder-$version-cnwithfont.3dsx"
          cp app/3ds-recorder.cia  "out/3ds-recorder-$version-cnwithfont.cia"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-recorder-cn-${{ github.sha }}
          path: out/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3ds-recorder-cn-${{ github.sha }}
          path: out

      # A QR code next to each package: scanned with FBI on the console, it installs straight from
      # the release asset. The image points at the asset's own download URL, so it is generated here.
      - name: QR codes for the packages
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-qrcode python3-pil
          tag=${GITHUB_REF#refs/tags/}
          repo=${GITHUB_REPOSITORY}
          for f in out/*.cia out/*.3dsx; do
            name=$(basename "$f")
            url="https://github.com/$repo/releases/download/$tag/$name"
            python3 - "$url" "out/$name.qr.png" <<'PY'
          import sys, qrcode
          qrcode.make(sys.argv[1], box_size=6, border=2).save(sys.argv[2])
          PY
          done
          ls -l out

      # The notes name the packages' QR codes at the top: on the console, FBI scans one and
      # installs straight from the release asset. The rest is this version's changes only.
      - name: Compose the notes
        run: |
          set -eu
          tag=${GITHUB_REF#refs/tags/}
          repo=${GITHUB_REPOSITORY}
          base="https://github.com/$repo/releases/download/$tag"
          {
            echo '| | 系统字库版 `-cn` | 自带字库版 `-cnwithfont` |'
            echo '|---|---|---|'
            echo "| CIA（FBI 扫码安装） | ![CIA cn]($base/$(basename out/*-cn.cia).qr.png) | ![CIA cnwithfont]($base/$(basename out/*-cnwithfont.cia).qr.png) |"
            echo "| 3DSX（Homebrew Launcher） | ![3DSX cn]($base/$(basename out/*-cn.3dsx).qr.png) | ![3DSX cnwithfont]($base/$(basename out/*-cnwithfont.3dsx).qr.png) |"
            echo
            cat .github/release-notes.md
          } > notes.md
          cat notes.md

      # -cn-rc.N tags are previews for hardware testing and stay out of the stable update checks.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: 3DS Recorder ${{ github.ref_name }}
          body_path: notes.md
          files: |
            out/*.cia
            out/*.3dsx
            out/*.qr.png
          prerelease: ${{ contains(github.ref_name, '-rc') }}
